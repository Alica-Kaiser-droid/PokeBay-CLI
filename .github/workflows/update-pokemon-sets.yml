name: Update Japanese Pokemon set names

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 1 * *"
    - cron: "17 2 15 * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx tsx scripts/updatePokemonSets.ts

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pokemon-sets.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Update Japanese Pokemon set names"
            git push origin main
          fi
